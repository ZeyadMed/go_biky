name: go_biky
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  # ── State management ────────────────────────────────
  bloc: ^8.1.4
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  get_it: ^8.0.2

  # ── Networking ─────────────────────────────────────
  dio: ^5.7.0
  pretty_dio_logger: ^1.4.0
  connectivity_plus: ^6.1.4
  internet_connection_checker_plus: ^2.7.1

  # ── Storage ────────────────────────────────────────
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.3

  # ── UI / navigation ────────────────────────────────
  go_router: ^16.1.0
  flutter_screenutil: ^5.9.3
  gap: ^3.0.1
  pinput: ^6.0.2

  # ── i18n / utils ───────────────────────────────────
  easy_localization: ^3.0.8
  intl: ^0.20.2
  logger: ^2.5.0
  uuid: ^4.5.1
  lottie: ^3.5.1


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

  fonts:
  # الديزاين: Regular 400 نصوص، Medium 500 عناصر مهمة، SemiBold 600 عناوين، Bold 700 إبراز
  - family: Cairo
    fonts:
      # ميتاداتا الملف usWeightClass 250، وفلاتر بيقبل مضاعفات 100 بس
      - asset: assets/fonts/Cairo-ExtraLight.ttf
        weight: 200
      - asset: assets/fonts/Cairo-Light.ttf
        weight: 300
      - asset: assets/fonts/Cairo-Regular.ttf
        weight: 400
      - asset: assets/fonts/Cairo-Medium.ttf
        weight: 500
      - asset: assets/fonts/Cairo-SemiBold.ttf
        weight: 600
      - asset: assets/fonts/Cairo-Bold.ttf
        weight: 700
      - asset: assets/fonts/Cairo-ExtraBold.ttf
        weight: 800
      - asset: assets/fonts/Cairo-Black.ttf
        weight: 900

  assets:
    - assets/svg/
    - assets/images/
    - assets/translations/

flutter_assets:
  assets_path: assets/
  output_path: lib/core/style/
  filename: assets.dart